[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Company-internal multi-agent orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.20"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
workflow = ["redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]