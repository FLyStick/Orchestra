# Orchestra 第二阶段基础设施 Docker Compose
# 由使用者手动部署，不在代码中自动拉起容器。
#
# 使用方式（项目根目录执行）：
#   docker-compose -f docker/docker-compose.yml up -d
#   docker-compose -f docker/docker-compose.yml ps
#   docker-compose -f docker/docker-compose.yml down

name: orchestra-phase2

services:
  redis:
    image: redis:7.4-alpine
    container_name: orchestra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - orchestra_redis:/data
    networks:
      - orchestra-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  chroma:
    image: chromadb/chroma:latest
    container_name: orchestra-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - orchestra_chroma:/data
    networks:
      - orchestra-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  orchestra_redis:
    name: orchestra_redis
  orchestra_chroma:
    name: orchestra_chroma

networks:
  orchestra-net:
    name: orchestra-net
